server {
    listen 80;

    # n8n webhook ingress. Telegram registers webhooks only on ports 80, 88,
    # 443 and 8443, and :443 is the only one this NAS forwards — it is already
    # taken by this stack via the DSM reverse proxy. So n8n's webhook paths are
    # proxied through here instead of getting their own reverse proxy entry.
    # No auth: a webhook endpoint has to be callable by Telegram, and the path
    # already carries n8n's per-workflow UUID. n8n's own basic auth never
    # covered these paths either, so this is not a downgrade.
    # Remove this block if n8n ever gets its own entry on an allowed port
    # (forwarding 8443 at the router would do it).
    location /webhook/      { include /etc/nginx/n8n_webhook.conf; }
    location /webhook-test/ { include /etc/nginx/n8n_webhook.conf; }
    # Wait-node resumes land here; unused today, cheap to keep correct.
    location /webhook-waiting/ { include /etc/nginx/n8n_webhook.conf; }

    location / {
        auth_basic           "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass          http://homepage:3000;
        proxy_http_version  1.1;
        proxy_set_header    Host              $http_host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering     off;
    }
}
