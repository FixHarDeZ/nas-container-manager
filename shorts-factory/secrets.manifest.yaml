# The dashboard needs no app secret: auth lives in nginx/.htpasswd, generated
# at setup time from the vault creds stacks.shorts_factory.dashboard.*
env:
  # mimo reuses the shared key that news-feed already points at — no new secret,
  # and ops-bot's own copy is left untouched.
  MIMO_API_KEY:       shared.llm.mimo_api_key
  TELEGRAM_BOT_TOKEN: stacks.shorts_factory.telegram.bot_token
  # Every inbound update is filtered against this chat id; it is the only trust
  # boundary this stack has. See docs/adr/0002.
  TELEGRAM_CHAT_ID:   stacks.shorts_factory.telegram.chat_id
  # Free Pexels key: supplies the stock footage behind each card. If it is
  # missing or the search comes up empty, cards fall back to the gradient.
  PEXELS_API_KEY:     stacks.shorts_factory.pexels_api_key
  # Filled by scripts/youtube_auth.py. Empty = the upload button never appears.
  YOUTUBE_CLIENT_ID:     stacks.shorts_factory.youtube.client_id
  YOUTUBE_CLIENT_SECRET: stacks.shorts_factory.youtube.client_secret
  YOUTUBE_REFRESH_TOKEN: stacks.shorts_factory.youtube.refresh_token

literals:
  MIMO_BASE_URL: https://token-plan-sgp.xiaomimimo.com/v1
  MIMO_MODEL:    mimo-v2.5-pro
  # A stalled response would otherwise hang the bot for 600s x retries
  MIMO_TIMEOUT_SECONDS: "600"
  # mimo-v2.5-pro is a reasoning model; the default thinking budget doubles
  # latency (161s vs 79s measured) without writing a better script
  MIMO_REASONING_EFFORT: low
  TTS_VOICE:     th-TH-NiwatNeural
  # The English Locale's voice. Verified present on the endpoint 2026-09-07;
  # edge-tts voice lists rot, so check with `edge_tts.list_voices()` before
  # changing it rather than guessing a name.
  TTS_VOICE_EN:  en-US-AndrewNeural
  TTS_RATE:      "+10%"
  TTS_PITCH:     "+0Hz"
  DATA_DIR:      /data
  OUTPUT_DIR:    /output
  # Drop CC0 / royalty-free tracks here; empty or missing = no music at all.
  BGM_DIR:       /output/bgm
  # 28 = Science & Technology
  YOUTUBE_CATEGORY_ID: "28"
  YOUTUBE_PRIVACY:     public
  # The Shorts feed ignores custom thumbnails, so this is off by default
  YOUTUBE_SET_THUMBNAIL: "false"
  # The bot runs /trends itself at these hours (container TZ = Asia/Bangkok)
  TRENDS_HOURS: "8,12,17"
  # How long an automatic list waits for a human tap before picking at random
  AUTO_PICK_MINUTES: "15"
